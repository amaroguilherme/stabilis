name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -s --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors https://amaroguilherme-stabilis-api.hf.space/health || true
