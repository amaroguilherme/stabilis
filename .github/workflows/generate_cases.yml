name: Generate Synthetic Clinical Cases

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:       # allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests jsonschema

      - name: Generate cases
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/clinical_cases_generator.py

      - name: Commit new cases
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/synthetic_cases_dataset_v3.jsonl
          git diff --cached --quiet || git commit -m "chore: add synthetic clinical cases [skip ci]"
          git push
